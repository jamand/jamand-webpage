name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting with Prettier
        run: pnpm prettier --check "**/*.{js,ts,jsx,tsx,astro,md,mdx,json,css,yml}"

      - name: Run ESLint
        run: pnpm lint

      - name: Run spellcheck
        run: pnpm cspell --no-progress "src/blog/**/*.{md,mdx}" "src/projects/**/*.{md,mdx}" "src/pages/**/*.astro"
