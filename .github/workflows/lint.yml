name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting with Prettier
        run: pnpm prettier --check "**/*.{js,ts,jsx,tsx,astro,md,mdx,json,css,yml}"

      - name: Run ESLint
        run: pnpm lint

      - name: Run spellcheck
        run: pnpm cspell --no-progress "src/blog/**/*.{md,mdx}" "src/projects/**/*.{md,mdx}" "src/pages/**/*.astro"
