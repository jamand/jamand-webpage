name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Placeholder for future tests
      # Uncomment and configure when tests are added:
      # - name: Run unit tests
      #   run: pnpm test
      #
      # - name: Run accessibility tests
      #   run: pnpm test:a11y

      - name: No tests configured
        run: echo "No tests configured yet. Add test commands above when ready."
