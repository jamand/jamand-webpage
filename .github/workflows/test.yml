name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Puppeteer browser (for a11y tests)
        run: pnpm rebuild puppeteer

      - name: Run unit tests
        run: pnpm test:run

      - name: Build site for accessibility testing
        run: pnpm build
        env:
          SITE_URL: http://localhost:4321

      - name: Start preview server
        run: pnpm preview &

      - name: Wait for preview server to be ready
        run: pnpm wait-on http://localhost:4321

      - name: Run accessibility tests
        run: pnpm test:a11y
        continue-on-error: true
