name: Main Branch CI

on:
  push:
    branches: [main]

# Explicit minimal permissions
permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  typecheck:
    uses: ./.github/workflows/typecheck.yml

  test:
    uses: ./.github/workflows/test.yml

  build:
    uses: ./.github/workflows/build.yml
